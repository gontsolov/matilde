name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Stable version (e.g. 0.1.0); must be newer than the latest release'
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  release:
    if: github.event_name == 'push' || github.ref == 'refs/heads/main'
    runs-on: macos-15
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      INPUT_VERSION: ${{ inputs.version }}
      # Release signing (docs/releases.md): with an Apple certificate in APPLE_CERTIFICATE_P12, every
      # release has the same designated requirement, so Keychain access survives updates. Without it,
      # releases stay ad-hoc signed. Notarization (Developer ID only) is a separate switch.
      SIGN_WITH_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE_P12 != '' }}
      NOTARIZE_RELEASE: ${{ vars.APPLE_NOTARIZE == 'true' || vars.APPLE_SIGNING_ENABLED == 'true' }}
    # The macOS app and its release scripts live in apps/macos.
    defaults:
      run:
        working-directory: apps/macos
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Validate version and release signing
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          test -n "$SPARKLE_PRIVATE_KEY" || { echo 'Missing SPARKLE_PRIVATE_KEY secret'; exit 1; }
          if [[ "$NOTARIZE_RELEASE" == true && "$SIGN_WITH_CERTIFICATE" != true ]]; then
            echo 'Notarization needs the APPLE_CERTIFICATE_P12 secret (a Developer ID Application certificate)'; exit 1
          fi
          echo "Release signing: $([[ "$SIGN_WITH_CERTIFICATE" == true ]] && echo certificate || echo ad-hoc); notarize: $NOTARIZE_RELEASE"
          python3 scripts/release-version.py
      - name: Test
        run: |
          swift test --disable-sandbox
          python3 -m unittest discover -s scripts/tests
      - name: Import release signing certificate
        if: env.SIGN_WITH_CERTIFICATE == 'true'
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          CODE_SIGN_IDENTITY: ${{ vars.CODE_SIGN_IDENTITY }}
        run: bash scripts/import-certificate.sh
      - name: Build Apple silicon app
        env:
          HARDENED_RUNTIME: ${{ env.NOTARIZE_RELEASE == 'true' && '1' || '0' }}
        run: |
          bash scripts/build-app.sh
          codesign -d -r- build/Matilde.app
      - name: Package download
        env:
          NOTARIZE: ${{ env.NOTARIZE_RELEASE == 'true' && '1' || '0' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: bash scripts/package-release.sh
      - name: Sign update archive and feed
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: bash scripts/sign-release.sh
      - name: Keep release artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Matilde-${{ env.MATILDE_VERSION }}
          path: |
            apps/macos/build/releases/${{ env.MATILDE_VERSION }}/Matilde.dmg
            apps/macos/build/releases/${{ env.MATILDE_VERSION }}/appcast.xml
            apps/macos/build/releases/${{ env.MATILDE_VERSION }}/SHA256SUMS
          if-no-files-found: error
      - name: Publish release
        run: bash scripts/publish-release.sh
      - name: Remove temporary signing keychain
        if: always() && env.SIGN_WITH_CERTIFICATE == 'true'
        run: |
          security delete-keychain "$RUNNER_TEMP/matilde-signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/matilde-signing.p12"
