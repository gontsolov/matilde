name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test
        run: swift test --disable-sandbox
      - name: Build app bundle
        run: bash scripts/build-app.sh
      - name: Check packaging
        run: |
          codesign --verify --deep --strict build/Matilde.app
          test "$(lipo -archs build/Matilde.app/Contents/MacOS/Matilde)" = arm64
          plutil -lint build/Matilde.app/Contents/Info.plist
          icons=$(find build/Matilde.app/Contents/Resources/Matilde_Matilde.bundle -path '*/Icons/*.pdf' | wc -l | tr -d ' ')
          expected=$(grep -cE '^ +case [A-Za-z]+ = "' Sources/Matilde/MatildeIcon.swift)
          echo "Bundled $icons of $expected icons"
          test "$icons" -eq "$expected"
          find build/Matilde.app/Contents/Resources/Matilde_Matilde.bundle -path '*/Icons/LICENSE' | grep -q .
          appicons=$(find build/Matilde.app/Contents/Resources/Matilde_Matilde.bundle -path '*/AppIcons/*.png' | wc -l | tr -d ' ')
          expected=$(ls Sources/Matilde/Resources/AppIcons/*.png | wc -l | tr -d ' ')
          echo "Bundled $appicons of $expected app icons"
          test "$appicons" -eq "$expected"
          bash -n scripts/*.sh
          python3 -m unittest discover -s scripts/tests
