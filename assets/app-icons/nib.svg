<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1024" height="1024" viewBox="0 0 1024 1024">
  <title>Nib</title>
  <desc>A polished brass fountain-pen nib on oxblood leather.</desc>
  <defs>
    <!-- macOS icon grid: 824 x 824 continuous-corner body centred on a 1024 canvas. -->
    <path id="body" d="M383.41 100H640.59C722.19 100 763 100 799.79 112.14C854.88 133.52 890.48 169.12 911.86 224.21C924 261 924 301.81 924 383.41V640.59C924 722.19 924 763 911.86 799.79C890.48 854.88 854.88 890.48 799.79 911.86C763 924 722.19 924 640.59 924H383.41C301.81 924 261 924 224.21 911.86C169.12 890.48 133.52 854.88 112.14 799.79C100 763 100 722.19 100 640.59V383.41C100 301.81 100 261 112.14 224.21C133.52 169.12 169.12 133.52 224.21 112.14C261 100 301.81 100 383.41 100Z"/>
    <clipPath id="clip"><use xlink:href="#body"/></clipPath>
    <linearGradient id="rim" x1="0" y1="100" x2="0" y2="924" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff" stop-opacity=".35"/>
      <stop offset=".18" stop-color="#fff" stop-opacity="0"/>
      <stop offset=".85" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity=".22"/>
    </linearGradient>

    <radialGradient id="leather" cx="330" cy="260" r="820" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#9C4A33"/>
      <stop offset=".55" stop-color="#6E2C1F"/>
      <stop offset="1" stop-color="#3F1610"/>
    </radialGradient>
    <path id="nib" d="M0 330 C30 262 150 110 150 -20 C150 -90 118 -132 118 -176 L118 -300 C118 -322 100 -334 78 -334 L-78 -334 C-100 -334 -118 -322 -118 -300 L-118 -176 C-118 -132 -150 -90 -150 -20 C-150 110 -30 262 0 330 Z"/>
    <linearGradient id="brass" x1="-150" y1="0" x2="150" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7A5419"/>
      <stop offset=".18" stop-color="#C9973F"/>
      <stop offset=".36" stop-color="#FBE6A6"/>
      <stop offset=".5" stop-color="#E0B55C"/>
      <stop offset=".52" stop-color="#9B6E24"/>
      <stop offset=".72" stop-color="#C08A35"/>
      <stop offset=".88" stop-color="#8E6220"/>
      <stop offset="1" stop-color="#5E3F12"/>
    </linearGradient>
    <linearGradient id="brassShade" x1="0" y1="-334" x2="0" y2="330" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3A2208" stop-opacity=".45"/>
      <stop offset=".22" stop-color="#3A2208" stop-opacity="0"/>
      <stop offset=".8" stop-color="#fff" stop-opacity="0"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".25"/>
    </linearGradient>
  </defs>
  <!-- Standard soft drop shadow, drawn as stacked strokes so every SVG renderer agrees. -->
  <g fill="none" stroke="#000" transform="translate(0 12)">
    <use xlink:href="#body" stroke-opacity=".022" stroke-width="56"/>
    <use xlink:href="#body" stroke-opacity=".03" stroke-width="40"/>
    <use xlink:href="#body" stroke-opacity=".04" stroke-width="26"/>
    <use xlink:href="#body" stroke-opacity=".06" stroke-width="12"/>
  </g>
  <use xlink:href="#body" fill="none" stroke="#000" stroke-opacity=".14" stroke-width="4" transform="translate(0 3)"/>
  <g clip-path="url(#clip)">
    <rect width="1024" height="1024" fill="url(#leather)"/>
    <!-- Faint stitching keeps the leather from reading as a flat colour. -->
    <use xlink:href="#body" fill="none" stroke="#E7B98E" stroke-opacity=".28" stroke-width="5" stroke-dasharray="20 16" transform="translate(512 512) scale(.9) translate(-512 -512)"/>
    <g transform="translate(528 500) rotate(45)">
    <g transform="translate(26 30)" stroke="#000" fill="none">
      <use xlink:href="#nib" stroke-opacity="0.140" stroke-width="48" stroke-linejoin="round"/>
      <use xlink:href="#nib" stroke-opacity="0.140" stroke-width="30" stroke-linejoin="round"/>
      <use xlink:href="#nib" stroke-opacity="0.140" stroke-width="14" stroke-linejoin="round"/>
    </g>
    <use xlink:href="#nib" fill="#000" fill-opacity="0.420" transform="translate(26 30)"/>
      <use xlink:href="#nib" fill="url(#brass)"/>
      <use xlink:href="#nib" fill="url(#brassShade)"/>
      <use xlink:href="#nib" fill="none" stroke="#4A2F0A" stroke-opacity=".55" stroke-width="5"/>
      <!-- Shoulder line, engraving, breather hole and slit. -->
      <path d="M-118 -190 C-60 -170 60 -170 118 -190" fill="none" stroke="#5A3A0E" stroke-opacity=".5" stroke-width="5"/>
      <path d="M-118 -186 C-60 -166 60 -166 118 -186" fill="none" stroke="#FFF1C4" stroke-opacity=".5" stroke-width="3" transform="translate(0 6)"/>
      <path d="M-88 40 C-70 -20 -40 -50 -24 -60 M88 40 C70 -20 40 -50 24 -60" fill="none" stroke="#5A3A0E" stroke-opacity=".45" stroke-width="5" stroke-linecap="round"/>
      <path d="M-104 70 C-86 -4 -52 -46 -30 -70 M104 70 C86 -4 52 -46 30 -70" fill="none" stroke="#5A3A0E" stroke-opacity=".3" stroke-width="4" stroke-linecap="round"/>
      <path d="M0 -60 L0 330" stroke="#2A1704" stroke-width="7"/>
      <path d="M3 -40 L3 300" stroke="#FFF0C0" stroke-opacity=".35" stroke-width="2"/>
      <circle cx="0" cy="-74" r="26" fill="#2A1309"/>
      <circle cx="0" cy="-74" r="26" fill="none" stroke="#FFF0C0" stroke-opacity=".45" stroke-width="3" stroke-dasharray="0 52 80"/>
      <!-- Specular glint. -->
      <path d="M-60 -300 C-62 -200 -86 -100 -96 -20 C-100 40 -76 120 -40 200" fill="none" stroke="#fff" stroke-opacity=".45" stroke-width="10" stroke-linecap="round"/>
    </g>
    <use xlink:href="#body" fill="none" stroke="url(#rim)" stroke-width="8"/>
  </g>
</svg>
