<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1024" height="1024" viewBox="0 0 1024 1024">
  <title>Midnight</title>
  <desc>Writing by moonlight: a crescent over a lit page, deep ink blue.</desc>
  <defs>
    <!-- macOS icon grid: 824 x 824 continuous-corner body centred on a 1024 canvas. -->
    <path id="body" d="M383.41 100H640.59C722.19 100 763 100 799.79 112.14C854.88 133.52 890.48 169.12 911.86 224.21C924 261 924 301.81 924 383.41V640.59C924 722.19 924 763 911.86 799.79C890.48 854.88 854.88 890.48 799.79 911.86C763 924 722.19 924 640.59 924H383.41C301.81 924 261 924 224.21 911.86C169.12 890.48 133.52 854.88 112.14 799.79C100 763 100 722.19 100 640.59V383.41C100 301.81 100 261 112.14 224.21C133.52 169.12 169.12 133.52 224.21 112.14C261 100 301.81 100 383.41 100Z"/>
    <clipPath id="clip"><use xlink:href="#body"/></clipPath>
    <linearGradient id="rim" x1="0" y1="100" x2="0" y2="924" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff" stop-opacity=".25"/>
      <stop offset=".18" stop-color="#fff" stop-opacity="0"/>
      <stop offset=".85" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity=".22"/>
    </linearGradient>

    <linearGradient id="night" x1="0" y1="100" x2="0" y2="924" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#26304D"/>
      <stop offset=".6" stop-color="#151B30"/>
      <stop offset="1" stop-color="#0C101E"/>
    </linearGradient>
    <radialGradient id="halo" cx="520" cy="400" r="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F6DFA8" stop-opacity=".32"/>
      <stop offset=".45" stop-color="#F6DFA8" stop-opacity=".08"/>
      <stop offset="1" stop-color="#F6DFA8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="moon" x1="420" y1="230" x2="640" y2="530" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFF4D6"/>
      <stop offset="1" stop-color="#EBCB86"/>
    </linearGradient>
    <linearGradient id="page" x1="0" y1="640" x2="0" y2="960" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F3E9D2"/>
      <stop offset="1" stop-color="#B9B3A6"/>
    </linearGradient>
    <path id="sheet" d="M170 700 L860 640 L900 1060 L210 1120 Z"/>
  </defs>
  <!-- Standard soft drop shadow, drawn as stacked strokes so every SVG renderer agrees. -->
  <g fill="none" stroke="#000" transform="translate(0 12)">
    <use xlink:href="#body" stroke-opacity=".022" stroke-width="56"/>
    <use xlink:href="#body" stroke-opacity=".03" stroke-width="40"/>
    <use xlink:href="#body" stroke-opacity=".04" stroke-width="26"/>
    <use xlink:href="#body" stroke-opacity=".06" stroke-width="12"/>
  </g>
  <use xlink:href="#body" fill="none" stroke="#000" stroke-opacity=".14" stroke-width="4" transform="translate(0 3)"/>
  <g clip-path="url(#clip)">
    <rect width="1024" height="1024" fill="url(#night)"/>
    <circle cx="520" cy="400" r="300" fill="url(#halo)"/>
    <!-- Crescent: outer arc of the moon, inner arc of the shadowing disc. -->
    <path d="M549.6 210.3 A170 170 0 1 0 708.0 463.7 A150 150 0 0 1 549.6 210.3 Z" fill="url(#moon)"/>
    <path d="M304 270 l9 25 25 9 -25 9 -9 25 -9 -25 -25 -9 25 -9 Z" fill="#F6E6BC"/>
    <path d="M782 520 l6 17 17 6 -17 6 -6 17 -6 -17 -17 -6 17 -6 Z" fill="#F6E6BC" fill-opacity=".8"/>
    <circle cx="236" cy="470" r="6" fill="#F6E6BC" fill-opacity=".6"/>
    <circle cx="820" cy="250" r="5" fill="#F6E6BC" fill-opacity=".55"/>
    <g transform="translate(0 -10)" stroke="#000" fill="none">
      <use xlink:href="#sheet" stroke-opacity="0.175" stroke-width="40" stroke-linejoin="round"/>
      <use xlink:href="#sheet" stroke-opacity="0.175" stroke-width="20" stroke-linejoin="round"/>
    </g>
    <use xlink:href="#sheet" fill="url(#page)"/>
    <g stroke="#8C8578" stroke-width="14" stroke-linecap="round" stroke-opacity=".7">
      <path d="M262 768 L742 726"/>
      <path d="M270 836 L690 799"/>
    </g>
    <use xlink:href="#body" fill="none" stroke="url(#rim)" stroke-width="8"/>
  </g>
</svg>
