<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1024" height="1024" viewBox="0 0 1024 1024">
  <title>Caret</title>
  <desc>A flat cream text cursor on terracotta, mid-sentence.</desc>
  <defs>
    <!-- macOS icon grid: 824 x 824 continuous-corner body centred on a 1024 canvas. -->
    <path id="body" d="M383.41 100H640.59C722.19 100 763 100 799.79 112.14C854.88 133.52 890.48 169.12 911.86 224.21C924 261 924 301.81 924 383.41V640.59C924 722.19 924 763 911.86 799.79C890.48 854.88 854.88 890.48 799.79 911.86C763 924 722.19 924 640.59 924H383.41C301.81 924 261 924 224.21 911.86C169.12 890.48 133.52 854.88 112.14 799.79C100 763 100 722.19 100 640.59V383.41C100 301.81 100 261 112.14 224.21C133.52 169.12 169.12 133.52 224.21 112.14C261 100 301.81 100 383.41 100Z"/>
    <clipPath id="clip"><use xlink:href="#body"/></clipPath>
    <linearGradient id="rim" x1="0" y1="100" x2="0" y2="924" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff" stop-opacity=".3"/>
      <stop offset=".18" stop-color="#fff" stop-opacity="0"/>
      <stop offset=".85" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity=".22"/>
    </linearGradient>

    <linearGradient id="terracotta" x1="0" y1="100" x2="0" y2="924" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#C46A45"/>
      <stop offset="1" stop-color="#B05A38"/>
    </linearGradient>
  </defs>
  <!-- Standard soft drop shadow, drawn as stacked strokes so every SVG renderer agrees. -->
  <g fill="none" stroke="#000" transform="translate(0 12)">
    <use xlink:href="#body" stroke-opacity=".022" stroke-width="56"/>
    <use xlink:href="#body" stroke-opacity=".03" stroke-width="40"/>
    <use xlink:href="#body" stroke-opacity=".04" stroke-width="26"/>
    <use xlink:href="#body" stroke-opacity=".06" stroke-width="12"/>
  </g>
  <use xlink:href="#body" fill="none" stroke="#000" stroke-opacity=".14" stroke-width="4" transform="translate(0 3)"/>
  <g clip-path="url(#clip)">
    <rect width="1024" height="1024" fill="url(#terracotta)"/>
    <!-- Words already written, then the cursor. -->
    <rect x="236" y="474" width="132" height="76" rx="38" fill="#E39A78"/>
    <rect x="404" y="474" width="180" height="76" rx="38" fill="#E39A78"/>
    <path d="M556 300 H608 C640 300 656 318 656 344 V680 C656 706 640 724 608 724 H556 M756 300 H704 C672 300 656 318 656 344 V680 C656 706 672 724 704 724 H756" fill="none" stroke="#FBF1E4" stroke-width="56" stroke-linecap="round" stroke-linejoin="round"/>
    <use xlink:href="#body" fill="none" stroke="url(#rim)" stroke-width="8"/>
  </g>
</svg>
